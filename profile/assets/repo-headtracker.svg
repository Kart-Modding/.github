<svg xmlns="http://www.w3.org/2000/svg" width="880" height="172" viewBox="0 0 880 172" role="img" aria-label="Head Locator: Real player heads on the locator bar instead of plain dots. Optional 360° border mode and Xaero's Minimap waypoints.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd3e6" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#3fd3e6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="878" height="170" rx="16"/></clipPath>
    <clipPath id="icon"><rect x="34" y="34" width="104" height="104" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="172" fill="#16171c"/>
    <rect width="880" height="172" fill="url(#glow)"/>
    <rect width="5" height="172" fill="#3fd3e6"/>
  </g>
  <rect x="1" y="1" width="878" height="170" rx="16" fill="none" stroke="#2a2b33" stroke-width="2"/>
  <rect x="32" y="32" width="108" height="108" rx="16" fill="#0e0f13" stroke="#3fd3e6" stroke-opacity=".6" stroke-width="2"/>
  <image x="34" y="34" width="104" height="104" clip-path="url(#icon)" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <text x="172" y="62" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f1f1f4">Head Locator</text>
  <text x="848" y="58" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#9c9daa">Kart-Modding/<tspan fill="#f1f1f4">HeadTracker</tspan> <tspan fill="#3fd3e6">↗</tspan></text>
  <text x="172" y="90" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#9c9daa">Real player heads on the locator bar instead of plain dots.</text><text x="172" y="111" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#9c9daa">Optional 360° border mode and Xaero's Minimap waypoints.</text>
  <rect x="172" y="124" width="63" height="24" rx="12" fill="#3fd3e6" fill-opacity=".12" stroke="#3fd3e6" stroke-opacity=".45"/><text x="203.5" y="140.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3fd3e6">Fabric</text><rect x="243" y="124" width="135" height="24" rx="12" fill="#3fd3e6" fill-opacity=".12" stroke="#3fd3e6" stroke-opacity=".45"/><text x="310.5" y="140.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3fd3e6">MC 1.21.6 – 26.3</text><rect x="386" y="124" width="99" height="24" rx="12" fill="#3fd3e6" fill-opacity=".12" stroke="#3fd3e6" stroke-opacity=".45"/><text x="435.5" y="140.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3fd3e6">Client-side</text><rect x="493" y="124" width="49" height="24" rx="12" fill="#3fd3e6" fill-opacity=".12" stroke="#3fd3e6" stroke-opacity=".45"/><text x="517.5" y="140.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3fd3e6">Java</text>
</svg>
